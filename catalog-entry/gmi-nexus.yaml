# GMI NEXUS — catalog entry for the Hermes plugin catalog.
#
# This is the file the pull request adds. It is added to
# NousResearch/hermes-agent under plugin-catalog/gmi-nexus.yaml.
#
# It pins commit 23e897b06b017873c2d31cb7ea9ad72f2b08999f of
# https://github.com/Joystonm/hermes-gmi-nexus
# and installs the plugin from the plugins/gmi-nexus subdirectory of that
# commit. That commit carries the tested plugin payload and the images.
# The commit after it adds only this copy of the entry, so the pin is one
# behind HEAD by design: the pin freezes a version, it does not track a
# branch. The images are pinned to the same commit, so the card can never
# show a picture of a different version than the code it describes.
#
# The pin appears in four places — `sha:`, `docs_url`, `image:` and every
# `screenshots:` URL — and all of them must be the same commit. Admission
# rule 2 requires an exact 40-character lowercase SHA: a branch, a tag or a
# short SHA is rejected by the loader.
#
# If the repository is pushed again after this commit, this file has to be
# re-pinned to the new SHA and submitted as a new pull request. Admission
# rule 4 requires a new PR for every SHA bump; editing an existing entry's
# SHA in place is not how an update is made.
#
# The `docs_url` must point at the README *at the pinned commit*, and the
# `subdir` must match the directory the plugin lives in.

name: gmi-nexus
repo: https://github.com/Joystonm/hermes-gmi-nexus
sha: 23e897b06b017873c2d31cb7ea9ad72f2b08999f
subdir: plugins/gmi-nexus
title: GMI NEXUS
description: >-
  Adaptive intelligence layer for Hermes Agent over the live GMI Cloud model
  catalogue. A goal is understood, planned into steps, and each step is routed
  to the model that suits it from the catalogue read live at runtime, so a
  retired model stops being routable and a new one becomes routable without a
  code change. Results are evaluated against each step's own criteria, a
  failure is recovered on a different model with bounded retries, the verified
  outcome feeds the routing statistics, and the report says what ran, what it
  cost and what failed. Ships a vision module for screenshots and before/after
  comparison, a benchmarking arena whose results feed the router, a Dev Agent
  that writes and tests code through Hermes' own tools, and a creative engine
  for image, video and audio generation and editing. Also ships a web
  dashboard tab. No third-party dependencies; the key is read through Hermes'
  secret scope; a per-run ceiling, a rolling daily ceiling and an approval
  threshold are enforced before any request is submitted.
maintainer: Joystonm
tier: community
category: models
requires_hermes: ">=0.21.6"
